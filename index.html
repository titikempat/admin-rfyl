<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ADMIN DASHBOARD RUN FOR YOUR LIFE 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#06152d;
padding:15px;
color:white;
}

.container{
max-width:1400px;
margin:auto;
}

/* =====================================
HEADER
===================================== */

.header{
background:#0d2347;
padding:22px;
border-radius:22px;
margin-bottom:20px;
box-shadow:0 0 30px rgba(0,0,0,0.25);
}

.header h1{
font-size:28px;
color:#f6c453;
margin-bottom:8px;
}

.header p{
font-size:14px;
color:#ccc;
}

/* =====================================
STATISTIK
===================================== */

.total-box{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
margin-bottom:20px;
}

.stat{
background:#0d2347;
padding:18px;
border-radius:20px;
text-align:center;
box-shadow:0 0 25px rgba(0,0,0,0.2);
}

.stat small{
color:#bbb;
font-size:13px;
}

.stat h2{
margin-top:8px;
font-size:28px;
color:#f6c453;
}

/* =====================================
CARD
===================================== */

.card{
background:#0d2347;
padding:18px;
border-radius:22px;
box-shadow:0 0 30px rgba(0,0,0,0.25);
overflow:hidden;
}

/* =====================================
SEARCH
===================================== */

.search-box{
margin-bottom:18px;
}

.search-box input{
width:100%;
padding:14px;
border:none;
border-radius:14px;
background:#132f5e;
color:white;
font-size:15px;
outline:none;
}

/* =====================================
TABLE WRAPPER
===================================== */

.table-wrapper{
overflow-x:auto;
border-radius:18px;
}

/* =====================================
TABLE
===================================== */

table{
width:100%;
border-collapse:collapse;
min-width:1050px;
}

th{
background:#132f5e;
padding:14px;
font-size:13px;
color:#f6c453;
text-align:left;
white-space:nowrap;
}

td{
padding:14px;
border-bottom:1px solid rgba(255,255,255,0.08);
font-size:13px;
vertical-align:top;
}

/* =====================================
STATUS
===================================== */

.status{
display:inline-block;
padding:6px 12px;
border-radius:999px;
font-size:11px;
font-weight:700;
}

.paid{
background:#123d24;
color:#6effa7;
}

.pending{
background:#4b3909;
color:#ffd56a;
}

.done{
background:#123d24;
color:#6effa7;
}

/* =====================================
BUTTONS
===================================== */

.action-group{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
min-width:180px;
}

.btn{
border:none;
padding:10px 10px;
border-radius:12px;
font-size:11px;
font-weight:700;
cursor:pointer;
transition:0.2s;
width:100%;
}

.btn:hover{
transform:scale(1.03);
}

.btn-paid{
background:#6effa7;
color:#06152d;
}

.btn-rpc{
background:#00c2ff;
color:white;
}

.btn-checkin{
background:#f6c453;
color:#06152d;
}

.btn-wa{
background:#25D366;
color:white;
}

/* =====================================
LOADING
===================================== */

.loading{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.55);
z-index:9999;
justify-content:center;
align-items:center;
backdrop-filter:blur(4px);
}

.loading-box{
background:#0d2347;
padding:28px;
border-radius:24px;
text-align:center;
width:260px;
}

.spinner{
width:55px;
height:55px;
border:5px solid rgba(255,255,255,0.1);
border-top:5px solid #f6c453;
border-radius:50%;
margin:auto;
animation:spin 1s linear infinite;
}

@keyframes spin{
100%{
transform:rotate(360deg);
}
}

.loading-text{
margin-top:18px;
font-size:15px;
color:#f6c453;
font-weight:600;
}

/* =====================================
MOBILE
===================================== */

@media(max-width:900px){

.total-box{
grid-template-columns:1fr 1fr;
}

.header h1{
font-size:22px;
}

.stat h2{
font-size:24px;
}

}

@media(max-width:600px){

body{
padding:10px;
}

.total-box{
grid-template-columns:1fr 1fr;
gap:10px;
}

.stat{
padding:14px;
}

.stat h2{
font-size:22px;
}

.card{
padding:12px;
}

th{
font-size:12px;
padding:10px;
}

td{
font-size:12px;
padding:10px;
}

.action-group{
grid-template-columns:1fr;
gap:6px;
min-width:120px;
}

.btn{
font-size:10px;
padding:9px;
border-radius:10px;
}

.search-box input{
font-size:14px;
padding:12px;
}

}

</style>

</head>

<body>

<div class="container">

<!-- HEADER -->
<div class="header">

<h1>
🏃 ADMIN DASHBOARD RFYL 2026
</h1>

<p>
Validasi pembayaran, racepack, check-in peserta
</p>

</div>

<!-- STATISTIK -->
<div class="total-box">

<div class="stat">
<small>Total Peserta</small>
<h2 id="totalPeserta">0</h2>
</div>

<div class="stat">
<small>PAID</small>
<h2 id="totalPaid">0</h2>
</div>

<div class="stat">
<small>RPC DONE</small>
<h2 id="totalRpc">0</h2>
</div>

<div class="stat">
<small>CHECK-IN DONE</small>
<h2 id="totalCheckin">0</h2>
</div>

</div>

<!-- CARD -->
<div class="card">

<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="Cari nama / register ID..."
onkeyup="filterPeserta()">

</div>

<div class="table-wrapper">

<table>

<thead>

<tr>

<th>Register ID</th>
<th>Nama Peserta</th>
<th>Kategori</th>
<th>WA</th>
<th>Payment</th>
<th>RPC</th>
<th>Check-In</th>
<th>Aksi</th>

</tr>

</thead>

<tbody id="tableBody">

</tbody>

</table>

</div>

</div>

</div>

<!-- LOADING -->
<div class="loading" id="loading">

<div class="loading-box">

<div class="spinner"></div>

<div class="loading-text">
Memproses Data...
</div>

</div>

</div>

<script>

// ======================================
// WEB APP URL
// ======================================

const WEBAPP_URL =
"https://script.google.com/macros/s/AKfycbwr5NReGwYtYWt7hvx4Kw_LwAEZ2d0hVj3WGUPxfYzDXfFO8tno8w-PBO026at7ZNAcaw/exec";

let pesertaData = [];

// ======================================
// SHOW LOADING
// ======================================

function showLoading(){

document.getElementById("loading")
.style.display = "flex";

}

// ======================================
// HIDE LOADING
// ======================================

function hideLoading(){

document.getElementById("loading")
.style.display = "none";

}

// ======================================
// LOAD PESERTA
// ======================================

async function loadPeserta(){

showLoading();

try{

const response = await fetch(WEBAPP_URL,{

method:"POST",

headers:{
"Content-Type":"text/plain"
},

body:JSON.stringify({

action:"getAllPeserta"

})

});

pesertaData =
await response.json();

renderTable(pesertaData);

updateStatistik();

hideLoading();

}catch(err){

hideLoading();

alert(err.message);

}

}

// ======================================
// UPDATE STATISTIK
// ======================================

function updateStatistik(){

document.getElementById("totalPeserta")
.innerText =
pesertaData.length;

document.getElementById("totalPaid")
.innerText =
pesertaData.filter(
x => x["Payment Status"] == "PAID"
).length;

document.getElementById("totalRpc")
.innerText =
pesertaData.filter(
x => x["RPC Status"] == "DONE"
).length;

document.getElementById("totalCheckin")
.innerText =
pesertaData.filter(
x => x["Check-In Status"] == "DONE"
).length;

}

// ======================================
// RENDER TABLE
// ======================================

function renderTable(data){

const tbody =
document.getElementById("tableBody");

tbody.innerHTML = "";

data.slice().reverse().forEach(item => {

const wa =
String(item["Nomor WA"] || "");

let nomorWA = wa;

if(nomorWA.startsWith("0")){

nomorWA =
"62" + nomorWA.substring(1);

}

const waText =
encodeURIComponent(

`Halo ${item["Nama Lengkap"]},

Pembayaran RUN FOR YOUR LIFE 2026 telah kami validasi ✅

Register ID :
${item["Register ID"]}

BIB :
${item["BIB Number"]}

Silahkan Cek Status kepesertaan melalui link dibawah :
https://titikempat.github.io/cekstatus-peserta/

jangan lupa pengambilan RPC Hari Sabtu, 26 September 2026 Pukul 15.00 - 21.00 WIB di Sunrise Mall Kota Mojokerto

Terima kasih 🙏`

);

tbody.innerHTML += `

<tr>

<td>
${item["Register ID"]}
</td>

<td>

<b>
${item["Nama Lengkap"]}
</b>

<br>

<small>
${item["BIB Number"]}
</small>

</td>

<td>
${item["Kategori"]}
</td>

<td>
${wa}
</td>

<td>

<span class="status ${
item["Payment Status"] == "PAID"
? "paid"
: "pending"
}">

${item["Payment Status"]}

</span>

</td>

<td>

<span class="status ${
item["RPC Status"] == "DONE"
? "done"
: "pending"
}">

${item["RPC Status"]}

</span>

</td>

<td>

<span class="status ${
item["Check-In Status"] == "DONE"
? "done"
: "pending"
}">

${item["Check-In Status"]}

</span>

</td>

<td>

<div class="action-group">

<button
class="btn btn-paid"
onclick="updateStatus(
'${item["Register ID"]}',
'Payment Status',
'PAID'
)">
PAID
</button>

<button
class="btn btn-rpc"
onclick="updateStatus(
'${item["Register ID"]}',
'RPC Status',
'DONE'
)">
RPC
</button>

<button
class="btn btn-checkin"
onclick="updateStatus(
'${item["Register ID"]}',
'Check-In Status',
'DONE'
)">
CHECK-IN
</button>

<a
href="https://wa.me/${nomorWA}?text=${waText}"
target="_blank"
style="width:100%;"
>

<button class="btn btn-wa">

WA

</button>

</a>

</div>

</td>

</tr>

`;

});

}

// ======================================
// UPDATE STATUS
// ======================================

async function updateStatus(
registerId,
field,
value
){

showLoading();

try{

const response =
await fetch(WEBAPP_URL,{

method:"POST",

headers:{
"Content-Type":"text/plain"
},

body:JSON.stringify({

action:"updateStatus",

registerId:registerId,

field:field,

value:value

})

});

const res =
await response.json();

hideLoading();

if(res.status == "success"){

await loadPeserta();

}else{

alert("Gagal update status");

}

}catch(err){

hideLoading();

alert(err.message);

}

}

// ======================================
// FILTER
// ======================================

function filterPeserta(){

const keyword =
document.getElementById("searchInput")
.value
.toLowerCase();

const filtered =
pesertaData.filter(item => {

return (

String(item["Nama Lengkap"])
.toLowerCase()
.includes(keyword)

||

String(item["Register ID"])
.toLowerCase()
.includes(keyword)

);

});

renderTable(filtered);

}

// ======================================
// START
// ======================================

loadPeserta();

</script>

</body>
</html>
