<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ADMIN DASHBOARD RFYL 2026</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#06152d;
padding:20px;
color:white;
}

.container{
max-width:1400px;
margin:auto;
}

.header{
background:#0d2347;
padding:25px;
border-radius:24px;
margin-bottom:25px;
box-shadow:0 0 40px rgba(0,0,0,0.3);
}

.header h1{
color:#f6c453;
font-size:32px;
margin-bottom:10px;
}

.header p{
color:#ccc;
}

.card{
background:#0d2347;
padding:25px;
border-radius:24px;
box-shadow:0 0 40px rgba(0,0,0,0.3);
overflow:auto;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
min-width:1200px;
}

th{
background:#132f5e;
padding:15px;
font-size:14px;
text-align:left;
color:#f6c453;
}

td{
padding:14px;
border-bottom:1px solid rgba(255,255,255,0.08);
font-size:14px;
vertical-align:middle;
}

.status{
padding:7px 14px;
border-radius:999px;
font-size:12px;
font-weight:700;
display:inline-block;
}

.paid{
background:#123d24;
color:#6effa7;
}

.pending{
background:#4b3909;
color:#ffd56a;
}

.done{
background:#123d24;
color:#6effa7;
}

.btn{
padding:10px 14px;
border:none;
border-radius:12px;
font-size:13px;
font-weight:700;
cursor:pointer;
margin-bottom:6px;
width:100%;
transition:0.2s;
}

.btn:hover{
transform:scale(1.03);
}

.btn-paid{
background:#6effa7;
color:#06152d;
}

.btn-rpc{
background:#00c2ff;
color:white;
}

.btn-checkin{
background:#f6c453;
color:#06152d;
}

.btn-wa{
background:#25D366;
color:white;
}

.loading{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
z-index:9999;
justify-content:center;
align-items:center;
backdrop-filter:blur(4px);
}

.loading-box{
background:#0d2347;
padding:30px;
border-radius:24px;
text-align:center;
width:280px;
}

.spinner{
width:60px;
height:60px;
border:6px solid rgba(255,255,255,0.1);
border-top:6px solid #f6c453;
border-radius:50%;
margin:auto;
animation:spin 1s linear infinite;
}

@keyframes spin{
100%{
transform:rotate(360deg);
}
}

.loading-text{
margin-top:20px;
font-size:16px;
color:#f6c453;
font-weight:600;
}

.search-box{
margin-top:20px;
}

.search-box input{
width:100%;
padding:15px;
border:none;
border-radius:14px;
background:#132f5e;
color:white;
font-size:15px;
}

.total-box{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
margin-bottom:25px;
}

.stat{
background:#132f5e;
padding:20px;
border-radius:20px;
text-align:center;
}

.stat h2{
font-size:30px;
margin-top:10px;
color:#f6c453;
}

@media(max-width:900px){

.total-box{
grid-template-columns:1fr 1fr;
}

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>
🏃 ADMIN DASHBOARD RFYL 2026
</h1>

<p>
Validasi pembayaran, racepack, check-in peserta
</p>

</div>

<div class="total-box">

<div class="stat">
<div>Total Peserta</div>
<h2 id="totalPeserta">0</h2>
</div>

<div class="stat">
<div>PAID</div>
<h2 id="totalPaid">0</h2>
</div>

<div class="stat">
<div>RPC DONE</div>
<h2 id="totalRpc">0</h2>
</div>

<div class="stat">
<div>CHECK-IN DONE</div>
<h2 id="totalCheckin">0</h2>
</div>

</div>

<div class="card">

<div class="search-box">

<input
type="text"
id="searchInput"
placeholder="Cari nama / register ID..."
onkeyup="filterPeserta()">

</div>

<table>

<thead>

<tr>

<th>Register ID</th>
<th>Nama</th>
<th>Kategori</th>
<th>WA</th>
<th>Payment</th>
<th>RPC</th>
<th>Check-In</th>
<th>Aksi</th>

</tr>

</thead>

<tbody id="tableBody">

</tbody>

</table>

</div>

</div>

<!-- LOADING -->
<div class="loading" id="loading">

<div class="loading-box">

<div class="spinner"></div>

<div class="loading-text">
Memproses data...
</div>

</div>

</div>

<script>

// ======================================
// WEB APP URL
// ======================================

const WEBAPP_URL =
"https://script.google.com/macros/s/AKfycbwr5NReGwYtYWt7hvx4Kw_LwAEZ2d0hVj3WGUPxfYzDXfFO8tno8w-PBO026at7ZNAcaw/exec";

let pesertaData = [];

// ======================================
// SHOW LOADING
// ======================================

function showLoading(){

document.getElementById("loading")
.style.display = "flex";

}

// ======================================
// HIDE LOADING
// ======================================

function hideLoading(){

document.getElementById("loading")
.style.display = "none";

}

// ======================================
// LOAD DATA PESERTA
// ======================================

async function loadPeserta(){

showLoading();

try{

const response = await fetch(WEBAPP_URL,{

method:"POST",

headers:{
"Content-Type":"text/plain"
},

body:JSON.stringify({

action:"getAllPeserta"

})

});

pesertaData = await response.json();

renderTable(pesertaData);

updateStatistik();

hideLoading();

}catch(err){

hideLoading();

alert(err.message);

}

}

// ======================================
// UPDATE STATISTIK
// ======================================

function updateStatistik(){

document.getElementById("totalPeserta")
.innerText = pesertaData.length;

document.getElementById("totalPaid")
.innerText =
pesertaData.filter(
x => x["Payment Status"] == "PAID"
).length;

document.getElementById("totalRpc")
.innerText =
pesertaData.filter(
x => x["RPC Status"] == "DONE"
).length;

document.getElementById("totalCheckin")
.innerText =
pesertaData.filter(
x => x["Check-In Status"] == "DONE"
).length;

}

// ======================================
// RENDER TABLE
// ======================================

function renderTable(data){

const tbody =
document.getElementById("tableBody");

tbody.innerHTML = "";

data.reverse().forEach(item => {

const wa =
String(item["Nomor WA"] || "");

let nomorWA = wa;

if(nomorWA.startsWith("0")){
nomorWA = "62" + nomorWA.substring(1);
}

const waText = encodeURIComponent(

`Halo ${item["Nama Lengkap"]},

Pembayaran RUN FOR YOUR LIFE 2026 telah kami validasi ✅

Register ID :
${item["Register ID"]}

BIB :
${item["BIB Number"]}

Terima kasih 🙏`

);

tbody.innerHTML += `

<tr>

<td>${item["Register ID"]}</td>

<td>
${item["Nama Lengkap"]}<br>
<small>${item["BIB Number"]}</small>
</td>

<td>${item["Kategori"]}</td>

<td>${wa}</td>

<td>

<span class="status ${
item["Payment Status"] == "PAID"
? "paid"
: "pending"
}">

${item["Payment Status"]}

</span>

</td>

<td>

<span class="status ${
item["RPC Status"] == "DONE"
? "done"
: "pending"
}">

${item["RPC Status"]}

</span>

</td>

<td>

<span class="status ${
item["Check-In Status"] == "DONE"
? "done"
: "pending"
}">

${item["Check-In Status"]}

</span>

</td>

<td>

<button
class="btn btn-paid"
onclick="updateStatus(
'${item["Register ID"]}',
'Payment Status',
'PAID'
)">
VALIDASI BAYAR
</button>

<button
class="btn btn-rpc"
onclick="updateStatus(
'${item["Register ID"]}',
'RPC Status',
'DONE'
)">
RPC DONE
</button>

<button
class="btn btn-checkin"
onclick="updateStatus(
'${item["Register ID"]}',
'Check-In Status',
'DONE'
)">
CHECK-IN
</button>

<a
href="https://wa.me/${nomorWA}?text=${waText}"
target="_blank"
style="text-decoration:none;"
>

<button class="btn btn-wa">

KIRIM WA

</button>

</a>

</td>

</tr>

`;

});

}

// ======================================
// UPDATE STATUS
// ======================================

async function updateStatus(
registerId,
field,
value
){

showLoading();

try{

const response = await fetch(WEBAPP_URL,{

method:"POST",

headers:{
"Content-Type":"text/plain"
},

body:JSON.stringify({

action:"updateStatus",

registerId:registerId,

field:field,

value:value

})

});

const res =
await response.json();

hideLoading();

if(res.status == "success"){

await loadPeserta();

}else{

alert("Gagal update status");

}

}catch(err){

hideLoading();

alert(err.message);

}

}

// ======================================
// FILTER SEARCH
// ======================================

function filterPeserta(){

const keyword =
document.getElementById("searchInput")
.value
.toLowerCase();

const filtered =
pesertaData.filter(item => {

return (
String(item["Nama Lengkap"])
.toLowerCase()
.includes(keyword)

||

String(item["Register ID"])
.toLowerCase()
.includes(keyword)
);

});

renderTable(filtered);

}

// ======================================
// START
// ======================================

loadPeserta();

</script>

</body>
</html>
